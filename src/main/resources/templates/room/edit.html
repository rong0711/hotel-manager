<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>编辑房间</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft Yahei", sans-serif;
    }
    body {
      width: 520px;
      margin: 50px auto;
      background-color: #f5f7fa;
    }
    .box {
      background: #fff;
      padding: 35px;
      border-radius: 10px;
      box-shadow: 0 2px 14px rgba(0,0,0,0.06);
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    h2 {
      color: #2d3748;
      font-size: 24px;
    }
    .btn-back-home {
      padding: 8px 16px;
      background: #909399;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-size: 14px;
    }
    .item {
      margin-bottom: 22px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #4e5969;
      font-size: 15px;
    }
    input, select {
      width: 100%;
      height: 42px;
      padding: 0 14px;
      border: 1px solid #dcdfe6;
      border-radius: 6px;
      font-size: 14px;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #409eff;
    }
    .btn-group {
      margin-top: 30px;
      display: flex;
      gap: 12px;
    }
    .save-btn {
      flex: 1;
      height: 44px;
      background: #409eff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
    }
    .back-list-btn {
      flex: 1;
      height: 44px;
      background: #909399;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div class="box">
  <div class="header-row">
    <h2>✏️ 编辑房间</h2>
    <a th:href="@{/}" class="btn-back-home">返回首页</a>
  </div>
  <form th:action="@{/room/update}" method="get">
    <input type="hidden" name="id" th:value="${room.id}">

    <div class="item">
      <label>房间号</label>
      <input type="text" name="roomNum" th:value="${room.roomNum}" required>
    </div>

    <!-- 房型下拉，循环渲染所有房型 -->
    <div class="item">
      <label>房型</label>
      <select name="typeId" required>
        <option th:each="t : ${typeList}"
                th:value="${t.id}"
                th:text="${t.typeName}"
                th:selected="${t.id == room.typeId}">
        </option>
      </select>
    </div>

    <div class="item">
      <label>房间状态</label>
      <select name="status" required>
        <option value="0" th:selected="${room.status == 0}">空闲</option>
        <option value="1" th:selected="${room.status == 1}">占用</option>
      </select>
    </div>

    <div class="btn-group">
      <button class="save-btn" type="submit">确认修改</button>
      <a th:href="@{/room/list}">
        <button class="back-list-btn" type="button">返回列表</button>
      </a>
    </div>
  </form>
</div>
</body>
</html>
