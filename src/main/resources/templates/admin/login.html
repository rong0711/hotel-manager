<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>酒店管理系统-登录</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft YaHei";
    }
    body {
      background: linear-gradient(135deg, #007bff, #4299e1);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-box {
      background: #fff;
      width: 420px;
      padding: 40px 30px;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }
    h2 {
      text-align: center;
      color: #2d3748;
      margin-bottom: 30px;
      font-size: 28px;
    }
    .error-tip {
      background: #ffebee;
      color: #d32f2f;
      text-align: center;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 20px;
    }
    .form-item {
      margin-bottom: 22px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #444;
      font-size: 16px;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }
    .login-btn {
      width: 100%;
      padding: 13px;
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
    }
    .login-btn:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
<div class="login-box">
  <h2>酒店管理后台登录</h2>
  <div th:if="${msg}" class="error-tip">[[${msg}]]</div>
  <form th:action="@{/admin/login}" method="post">
    <p style="color:red" th:text="${msg}"></p>
    账号：<input type="text" name="username"><br>
    密码：<input type="password" name="password"><br>
    <button type="submit">登录</button>
  </form>
</div>
</body>
</html>
