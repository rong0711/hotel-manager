<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>客户列表</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
<div class="d-flex justify-content-between align-items-center mb-4">
  <h2>客户信息列表</h2>
  <div>
    <a href="/customer/add" class="btn btn-primary">➕ 新增客户</a>
    <a href="/index" class="btn btn-secondary">🏠 返回首页</a>
  </div>
</div>
<table class="table table-striped">
  <thead>
  <tr>
    <th>ID</th>
    <th>姓名</th>
    <th>手机号</th>
    <th>身份证号</th>
    <th>操作</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="c : ${list}">
    <td th:text="${c.id}"></td>
    <td th:text="${c.name}"></td>
    <td th:text="${c.phone}"></td>
    <td th:text="${c.idCard}"></td>
    <td>
      <a th:href="@{/customer/edit(id=${c.id})}" class="btn btn-sm btn-warning">编辑</a>
      <a th:href="@{/customer/delete(id=${c.id})}" class="btn btn-sm btn-danger" onclick="return confirm('确定删除？')">删除</a>
    </td>
  </tr>
  </tbody>
</table>
</body>
</html>
