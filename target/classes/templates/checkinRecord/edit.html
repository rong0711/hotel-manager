<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>编辑入住记录</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft Yahei", sans-serif;
    }
    body {
      width: 520px;
      margin: 50px auto;
      background-color: #f5f7fa;
    }
    .box {
      background: #fff;
      padding: 35px;
      border-radius: 10px;
      box-shadow: 0 2px 14px rgba(0,0,0,0.06);
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    h2 {
      color: #2d3748;
      font-size: 24px;
    }
    .btn-back-home {
      padding: 8px 16px;
      background: #909399;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-size: 14px;
    }
    .item {
      margin-bottom: 22px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #4e5969;
      font-size: 15px;
    }
    input, select {
      width: 100%;
      height: 42px;
      padding: 0 14px;
      border: 1px solid #dcdfe6;
      border-radius: 6px;
      font-size: 14px;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #409eff;
    }
    .btn-group {
      margin-top: 30px;
      display: flex;
      gap: 12px;
    }
    .save-btn {
      flex: 1;
      height: 44px;
      background: #409eff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
    }
    .back-list-btn {
      flex: 1;
      height: 44px;
      background: #909399;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div class="box">
  <div class="header-row">
    <h2>✏️ 编辑入住记录</h2>
    <a th:href="@{/}" class="btn-back-home">返回首页</a>
  </div>
  <form th:action="@{/checkinRecord/update}" method="get">
    <!-- 隐藏主键id，后端更新必须 -->
    <input type="hidden" name="id" th:value="${record.id}">
    <!-- 操作员固定为管理员，隐藏不展示 -->
    <input type="hidden" name="adminId" value="1">

    <!-- 房间：下拉展示房间号，自动回显原有房间 -->
    <div class="item">
      <label>房间号</label>
      <select name="roomId" required>
        <option th:each="room : ${allRoomList}"
                th:value="${room.id}"
                th:text="${room.roomNum}"
                th:selected="${room.id == record.roomId}">
        </option>
      </select>
    </div>

    <!-- 客户：下拉展示客户姓名，自动回显原有客户 -->
    <div class="item">
      <label>客户姓名</label>
      <select name="customerId" required>
        <option th:each="c : ${customerList}"
                th:value="${c.id}"
                th:text="${c.name}"
                th:selected="${c.id == record.customerId}">
        </option>
      </select>
    </div>

    <!-- 消费金额输入框 -->
    <div class="item">
      <label>消费总金额</label>
      <input type="number" step="0.01" name="totalMoney" th:value="${record.totalMoney}" required>
    </div>

    <div class="btn-group">
      <button class="save-btn" type="submit">确认修改</button>
      <a th:href="@{/checkinRecord/list}">
        <button class="back-list-btn" type="button">返回列表</button>
      </a>
    </div>
  </form>
</div>
</body>
</html>
