<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>新增客户</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5 w-50">
<div class="d-flex justify-content-between align-items-center mb-4">
  <h2>➕ 新增客户</h2>
  <a href="/index" class="btn btn-secondary">🏠 返回首页</a>
</div>
<form th:action="@{/customer/save}" method="get">
  <div class="mb-3">
    <label class="form-label">客户姓名</label>
    <input type="text" name="name" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">联系电话</label>
    <input type="text" name="phone" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">身份证号</label>
    <input type="text" name="idCard" class="form-control" required>
  </div>
  <button type="submit" class="btn btn-success">保存客户</button>
  <a href="/customer/list" class="btn btn-secondary">返回列表</a>
</form>
</body>
</html>
