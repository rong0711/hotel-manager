<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>房间管理列表</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            width: 90%;
            margin: 30px auto;
            background-color: #f5f7fa;
        }
        h2 {
            color: #2d3748;
            margin-bottom: 15px;
        }
        .btn-group {
            margin-bottom: 20px;
        }
        .add-btn {
            display: inline-block;
            padding: 8px 16px;
            background: #409eff;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            margin-right: 12px;
        }
        .add-btn:hover {
            background: #66b1ff;
        }
        .home-btn {
            display: inline-block;
            padding: 8px 16px;
            background: #67c23a;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
        }
        .home-btn:hover {
            background: #85ce61;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 1px 12px rgba(0,0,0,0.08);
        }
        th,td {
            padding: 12px 16px;
            text-align: center;
            border: none;
        }
        th {
            background-color: #409eff;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f8fafc;
        }
        tr:hover {
            background-color: #eef5ff;
        }
        .edit {
            color: #409eff;
            text-decoration: none;
            margin-right: 10px;
        }
        .del {
            color: #f56c6c;
            text-decoration: none;
        }
    </style>
</head>
<body>
<h2>房间管理列表</h2>
<div class="btn-group">
    <a th:href="@{/room/add}" class="add-btn">+ 新增房间</a>
    <a th:href="@{/}" class="home-btn">← 返回首页</a>
</div>
<table>
    <tr>
        <th>ID</th>
        <th>房间号</th>
        <!-- 表头改为房型名称 -->
        <th>房型</th>
        <th>房间状态</th>
        <th>操作</th>
    </tr>
    <tr th:each="r : ${pageData}">
        <td th:text="${r.id}"></td>
        <td th:text="${r.roomNum}"></td>
        <!-- 匹配房型ID，展示对应房型名称 -->
        <td>
            <span th:each="t : ${typeList}" th:if="${t.id == r.typeId}" th:text="${t.typeName}"></span>
        </td>
        <td th:text="${r.status == 0 ? '空闲' : '占用'}"></td>
        <td>
            <a th:href="@{/room/edit(id=${r.id})}" class="edit">编辑</a>
            <a th:href="@{/room/delete(id=${r.id})}" class="del" onclick="return confirm('确定删除该房间？')">删除</a>
        </td>
    </tr>
</table>
</body>
</html>
